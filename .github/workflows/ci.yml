name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ada-be

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-be/package-lock.json

      - run: npm ci

      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/database

      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ada-fe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-fe/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:3000/api/v1

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: arga_damar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ada -d arga_damar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ada-be
    env:
      DATABASE_URL: postgresql://ada:isolated-test-password@localhost:5432/arga_damar_test
      TEST_DATABASE_URL: postgresql://ada:isolated-test-password@localhost:5432/arga_damar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-be/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - name: Verify production catalog seed
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/seed.production-catalog.sql
      - run: npm run test:e2e -- --runInBand

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, frontend, postgres-integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t ada-api:ci ada-be
      - name: Verify production dependencies
        run: docker run --rm --entrypoint node ada-api:ci -e "require('./dist/app.module.js')"
      - run: docker build -t ada-web:ci ada-fe
      - name: Validate proxy configuration
        run: docker run --rm -e APP_DOMAIN=ci.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
