name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ada-be

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-be/package-lock.json

      - run: npm ci

      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/database

      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ada-fe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-fe/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:3000/api/v1

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ada
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: arga_damar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ada -d arga_damar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ada-be
    env:
      DATABASE_URL: postgresql://ada:isolated-test-password@localhost:5432/arga_damar_test
      TEST_DATABASE_URL: postgresql://ada:isolated-test-password@localhost:5432/arga_damar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ada-be/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run test:e2e -- --runInBand
