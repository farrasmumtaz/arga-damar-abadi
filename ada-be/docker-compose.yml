services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arga_damar
      POSTGRES_USER: arga_damar
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arga_damar -d arga_damar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
